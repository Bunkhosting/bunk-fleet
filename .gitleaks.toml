# Geheimenscan (gitleaks). De standaardregels, plus wat we bewust laten staan.
#
# Elke uitzondering hieronder heeft een reden. Een lange lijst maakt de scan
# waardeloos: wat erop staat, wordt nooit meer bekeken.
[extend]
useDefault = true

[allowlist]
description = "Bewust onschuldige treffers"
paths = [
  # De standaard secret_key_base van Phoenix voor ontwikkeling en tests. Hij
  # beschermt niets: productie leest SECRET_KEY_BASE uit de omgeving en weigert
  # te starten zonder (config/runtime.exs).
  '''control_plane/config/dev\.exs''',
  '''control_plane/config/test\.exs''',
]
commits = [
  # 85d88c3 (2026-06-26) zette .env.prod in de repo: DB_PASSWORD,
  # SECRET_KEY_BASE en ADMIN_TOKEN. Alle drie zijn vervangen -- de laatste, het
  # databasewachtwoord, op 2026-10-09. De waarden in deze commit openen niets
  # meer. Wie hier ooit een andere commit bij zet: eerst vervangen, dan pas hier.
  "85d88c3c32632f5ea20570cb613283cc5fdfb431",
]
regexTarget = "line"
regexes = [
  # Een tabelregel in docs/architecture.md die de regel generic-api-key voor
  # een sleutel aanziet.
  '''node creds, payout/billing secrets''',
]
