name: Deploy

# Uitrollen gebeurt hier, niet vanaf iemands laptop. Een push naar main die de
# CI haalt gaat vanzelf naar productie; er is geen tussenstap waar een mens iets
# moet draaien en dus ook geen stap die iemand kan overslaan.
#
# Het hangt aan CI en niet aan de push zelf. Eerder liepen ze naast elkaar: een
# commit met een rode type-check stond gewoon live terwijl de CI nog rood in de
# lijst stond. `needs:` kan hier niet -- dat werkt alleen binnen één workflow --
# dus dit is een workflow_run op de uitkomst van CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Handmatig starten blijft mogelijk, bijvoorbeeld om een uitrol te herhalen
  # nadat een machine terug is van onderhoud. Dat slaat de CI-eis bewust over:
  # het is een mens die weet wat hij doet, en soms is dat precies wat nodig is
  # als de CI zelf stuk zit. Wel alleen vanaf main (zie de `if:` hieronder).
  workflow_dispatch:

# Uitrollen leest de repo en praat verder alleen met de machine zelf; naar
# GitHub hoeft niets terug geschreven te worden.
permissions:
  contents: read

# Twee uitrollen tegelijk hebben elkaar hier eerder de das omgedaan: allebei
# bouwden ze hetzelfde image en de tweede herstartte de control plane terwijl de
# eerste nog migreerde. Eén tegelijk, en een nieuwe wacht netjes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Bouwen op een runner van GitHub, niet op VM102. Die machine heeft twee cores
  # en draait daarnaast productie; tijdens een build liep de load naar 34 en werd
  # de dienst meetbaar traag. Hier komt alleen het resultaat naartoe: twee images
  # als artefact van deze run, die de uitrol hieronder inlaadt.
  #
  # Er gaat niets geheims in: het control plane krijgt zijn geheimen pas bij het
  # starten uit .env.prod, en de waarden die de frontend bij het bouwen leest
  # staan openbaar in frontend/.env.production. Een image van hier is dus
  # hetzelfde als een image van VM102 -- de repo is openbaar, dit artefact ook.
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Control plane en agent bouwen
        run: bash build-prod.sh
      - name: Frontend bouwen
        run: docker build -t bunk-frontend:latest frontend
      - name: Images inpakken
        run: |
          docker save bunk-fleet-cp:latest bunk-frontend:latest | gzip -1 > images.tar.gz
          ls -la images.tar.gz .build-version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images
          path: |
            images.tar.gz
            .build-version
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  deploy:
    # Wacht op de bouw, maar loopt ook als die mislukte: dan bouwt VM102 zelf,
    # zoals het altijd deed. Een storing bij GitHub mag geen uitrol tegenhouden.
    needs: bouwen
    # De self-hosted runner draait op de machine waar de stack staat. Dat is
    # bewust: de secrets liggen daar in .env.prod en hoeven zo nooit in GitHub.
    runs-on: [self-hosted, bunk-fleet]
    # Ruim, want een afgekapte uitrol is erger dan een trage. Deze stond op 45
    # en werd een keer geraakt: de control plane stond toen al uitgerold en de
    # frontend niet, en dat verschil merk je pas als er wél een wijziging in
    # allebei zit. De bouw draait op dezelfde twee cores als productie, dus
    # onder belasting duurt hij veel langer dan de tien minuten die het normaal
    # is.
    timeout-minutes: 90
    # Een workflow_run vuurt ook af als de CI faalde of is afgebroken; alleen
    # "success" mag door.
    #
    # En alleen een push naar main van DEZE repo. Het filter `branches: [main]`
    # hierboven kijkt naar de naam van de branch, en die kiest een fork zelf: een
    # pull request uit een fork met een branch die "main" heet laat de CI draaien,
    # en als die slaagt startte deze uitrol -- met de code van de fork, op de
    # machine waar .env.prod ligt. De repo is openbaar, dus dat kon iedereen.
    # Handmatig starten mag alleen vanaf main: anders gaat een branch die de CI
    # nooit zag zo live.
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))

    steps:
      # De commit die de CI daadwerkelijk heeft gekeurd, niet de laatste stand
      # van main: bij twee pushes vlak na elkaar zijn dat niet dezelfde.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Images ophalen
        if: needs.bouwen.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images

      - name: Images inladen
        if: needs.bouwen.result == 'success'
        run: |
          gunzip -c images.tar.gz | docker load
          rm -f images.tar.gz
          echo "versie: $(cat .build-version)"

      - name: Bouwen op VM102 (vangnet)
        if: needs.bouwen.result != 'success'
        run: |
          echo "::warning::de bouw op GitHub mislukte of liep niet; VM102 bouwt zelf"
          bash build-prod.sh
          docker build -t bunk-frontend:latest frontend

      - name: Control plane uitrollen
        # Draait de migraties en vervangt de container. Het script faalt zelf als
        # de nieuwe container niet gezond opkomt, dus een kapotte uitrol maakt
        # deze stap rood in plaats van stilletts door te gaan.
        run: bash deploy-prod.sh

      - name: Frontend en edge uitrollen
        # Het image staat er al: van de bouwjob, of van het vangnet hierboven.
        env:
          BUNK_SKIP_BUILD: "1"
        run: bash deploy-frontend.sh

      - name: Controleren dat het draait
        # Een groene uitrol die niets serveert is geen groene uitrol.
        run: |
          set -e
          # Allebei door de edge, want dat is de weg die een klant ook neemt --
          # en het control plane publiceert geen eigen poort meer op de host:
          # tijdens een uitrol staan er twee containers, en die kunnen dezelfde
          # poort niet allebei hebben.
          for url in http://127.0.0.1:3001/api/v1/auth/me http://127.0.0.1:3001/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "$url -> $code"
            case "$code" in
              200|401) ;;
              *) echo "onverwachte status voor $url"; exit 1 ;;
            esac
          done
