name: CI

# Everything that must be true before code reaches a customer. The guidelines ask
# for a linter and a type checker with warnings treated as errors, and for code to
# be scanned before deployment; this is where that is enforced rather than
# remembered. Local runs (tools/check.sh) are the fast loop — this is the gate.

on:
  push:
    branches: [main]
  pull_request:

# Alleen lezen. Zonder dit blok krijgt GITHUB_TOKEN wat de repo-instelling zegt,
# en dat is historisch schrijfrechten: dan kan een action die hier draait naar
# main pushen of een release maken. Niets in deze workflow hoeft te schrijven --
# hij bouwt en test alleen -- dus staat het hier expliciet en niet in een
# instelling die niemand meer opzoekt.
permissions:
  contents: read

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Kept current on purpose: the agent runs on hardware we do not own and
          # speaks TLS to the control plane, so its standard library is part of
          # the attack surface. See the note in go.mod.
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        # Vastgezet op de commit van v1.4.1 en niet op de tag: een tag kan door
        # de eigenaar van de action verplaatst worden, en dan draait er andere
        # code in onze CI zonder dat er iets in deze repo verandert. De tag
        # staat erbij zodat een mens ziet wat het is.
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          working-directory: agent
          install-go: false

      - name: Build
        run: go build ./...

      - name: Test (with the race detector)
        # The agent runs a command consumer, a heartbeat loop, a forward sync and
        # one goroutine per console session against shared state. Races here are
        # the kind that only show up on a customer's node.
        run: go test -race ./...

      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  control_plane:
    name: Elixir control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control_plane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/control_plane_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        # Zie de opmerking bij staticcheck-action hierboven: commit, niet tag.
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore deps + _build cache
        uses: actions/cache@v4
        with:
          path: |
            control_plane/deps
            control_plane/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('control_plane/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint
        run: mix credo --strict

      - name: Known vulnerabilities
        run: mix deps.audit

      - name: Run tests
        run: mix test

      # Het installatiescript is shell die uit een Elixir-string wordt opgebouwd,
      # dus de compiler zegt er niets over. Hier wel, want deze runner heeft bash;
      # de container waarin de suite lokaal draait niet, en een test die zich per
      # omgeving anders gedraagt is geen test.
      - name: Install script is valid shell
        run: |
          mix run --no-start -e 'File.write!("install.sh", ControlPlaneWeb.WorkerInstallController.render_script("https://app.example.test"))'
          bash -n install.sh
          rm -f install.sh

      # Dialyzer last: it is the slowest step and the least likely to fail, so
      # everything cheaper gets to report first.
      - name: Restore Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: control_plane/priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('control_plane/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Type check
        run: mix dialyzer --format github

  # De uitrolscripts zijn productiecode. Shellcheck staat op de runners van
  # GitHub voorgeinstalleerd, dus dit kost niets en het vangt precies de fout
  # waarmee ooit een uitrol halverwege afbrak: een commentaarregel middenin een
  # commando met regelvervolgen, syntactisch volstrekt geldig (SC1143).
  shell:
    name: Shellscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning *.sh tools/*.sh provisioning/*/*.sh

  # De enige controle die over de grens tussen Elixir en TypeScript heen kijkt.
  # `mix test` ziet frontend/ niet en de e2e-suite kent de foutentabel niet;
  # hier staat de hele repo er wel. Kosten: een seconde.
  foutcodes:
    name: Foutcodes hebben een zin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/foutcodes.py

  # De e2e-suite draait niet in de CI -- hij heeft een live omgeving nodig en
  # die zetten we niet op voor elke push. Wat hier wel kan is kijken of hij nog
  # compileert: een suite die pas stukgaat op het moment dat je hem nodig hebt,
  # is geen suite.
  e2e-typecheck:
    name: E2E-suite (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # eslint rechtstreeks: `next lint` is in Next 16 een dunne wrapper zonder
      # --max-warnings, en de vlag stil verliezen zou de lintdrempel uitzetten
      # zonder dat iemand het merkt.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Known vulnerabilities
        # Production dependencies only: a dev-tool advisory should not block a
        # deploy, but anything that ships to a browser should.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
